name: NEXUS Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4

      - name: Checkout Android foundation
        uses: actions/checkout@v4
        with:
          repository: Akira9021/Dynamic-Island-
          ref: claude/android-dynamic-island-yrzsvq
          path: upstream

      - name: Apply NEXUS identity
        working-directory: upstream
        run: |
          mkdir -p app/src/main/java/com/akira/island/ui/screens
          cp ../nexus-overlay/NexusBrandPanel.kt app/src/main/java/com/akira/island/ui/screens/NexusBrandPanel.kt
          cp ../nexus-overlay/Theme.kt app/src/main/java/com/akira/island/ui/Theme.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/akira/island/ui/screens/HomeScreen.kt")
          s = p.read_text()
          old = 'Page(tr("Динамический остров", "Dynamic Island")) {\n        IslandPreview()'
          new = 'Page("NEXUS") {\n        NexusBrandPanel(open)\n        IslandPreview()'
          if old not in s:
              raise SystemExit("Could not find the expected HomeScreen insertion point")
          p.write_text(s.replace(old, new, 1))
          g = Path("app/build.gradle.kts")
          s = g.read_text().replace('applicationId = "com.akira.island"', 'applicationId = "com.nexus.island"')
          s = s.replace('versionName = "1.6.5"', 'versionName = "0.1.0"')
          g.write_text(s)
          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          import re
          s, count = re.subn(r'(<string name="app_name">).*?(</string>)', r'\1NEXUS\2', s, count=1)
          if count:
              strings.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NEXUS debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-cyber-glass-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
