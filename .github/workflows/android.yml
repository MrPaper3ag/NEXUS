name: NEXUS Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4

      - name: Checkout Android foundation
        uses: actions/checkout@v4
        with:
          repository: Akira9021/Dynamic-Island-
          ref: claude/android-dynamic-island-yrzsvq
          path: upstream

      - name: Apply NEXUS identity and overlay upgrades
        working-directory: upstream
        run: |
          mkdir -p app/src/main/java/com/akira/island/ui/screens
          cp ../nexus-overlay/NexusBrandPanel.kt app/src/main/java/com/akira/island/ui/screens/NexusBrandPanel.kt
          cp ../nexus-overlay/Theme.kt app/src/main/java/com/akira/island/ui/Theme.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/akira/island/ui/screens/HomeScreen.kt")
          s = p.read_text()
          old = 'Page(tr("Динамический остров", "Dynamic Island")) {\n        IslandPreview()'
          new = 'Page("NEXUS") {\n        NexusBrandPanel(open)\n        IslandPreview()'
          if old not in s:
              raise SystemExit("Could not find the expected HomeScreen insertion point")
          p.write_text(s.replace(old, new, 1))

          g = Path("app/build.gradle.kts")
          s = g.read_text().replace('applicationId = "com.akira.island"', 'applicationId = "com.nexus.island"')
          s = s.replace('versionName = "1.6.5"', 'versionName = "0.2.0"')
          g.write_text(s)
          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          import re
          s, count = re.subn(r'(<string name="app_name">).*?(</string>)', r'\1NEXUS\2', s, count=1)
          if count:
              strings.write_text(s)

          # NEXUS: notification inbox keeps the latest app messages in the capsule
          bus = Path("app/src/main/java/com/akira/island/core/IslandBus.kt")
          s = bus.read_text()
          anchor = '    val notice = MutableStateFlow<Notice?>(null)\n'
          if anchor not in s: raise SystemExit("IslandBus notice anchor not found")
          s = s.replace(anchor, anchor + '    /** Recent app notifications stay available after the short banner animation. */\n    val messageNotices = MutableStateFlow<List<Notice>>(emptyList())\n', 1)
          bus.write_text(s)

          act = Path("app/src/main/java/com/akira/island/island/Act.kt")
          s = act.read_text()
          old = '    data class NoticeA(val n: Notice) : Act("notice", transient = true)'
          new = '    data class NoticeA(val n: Notice) : Act("notice", transient = n.message == null)'
          if old not in s: raise SystemExit("NoticeA transient declaration not found")
          act.write_text(s.replace(old, new, 1))

          messages = Path("app/src/main/java/com/akira/island/service/Messages.kt")
          s = messages.read_text()
          old = '        IslandBus.post(\n            Notice(\n'
          new = '        val persistentNotice = Notice(\n'
          if old not in s: raise SystemExit("Messages post block start not found")
          s = s.replace(old, new, 1)
          old = '                extraMs = if (actions.isEmpty()) 2_000 else 4_500,\n            ),\n        )'
          new = '''                extraMs = if (actions.isEmpty()) 2_000 else 4_500,
            )
        IslandBus.messageNotices.value = (IslandBus.messageNotices.value.filterNot { it.message?.key == sbn.key } + persistentNotice).takeLast(8)
        IslandBus.post(persistentNotice)'''
          if old not in s: raise SystemExit("Messages post block end not found")
          s = s.replace(old, new, 1)
          old = '    fun forget(key: String) {\n        shown.remove(key)'
          new = '    fun forget(key: String) {\n        IslandBus.messageNotices.value = IslandBus.messageNotices.value.filterNot { it.message?.key == key }\n        shown.remove(key)'
          if old not in s: raise SystemExit("Messages forget block not found")
          messages.write_text(s.replace(old, new, 1))

          overlay = Path("app/src/main/java/com/akira/island/island/IslandOverlay.kt")
          s = overlay.read_text()
          anchor = '    val notice by IslandBus.notice.collectAsState()\n'
          if anchor not in s: raise SystemExit("Overlay notice collect anchor not found")
          s = s.replace(anchor, anchor + '    val messageNotices by IslandBus.messageNotices.collectAsState()\n', 1)
          anchor = '        notice?.let { add(Act.NoticeA(it)) }\n'
          if anchor not in s: raise SystemExit("Overlay notice acts anchor not found")
          s = s.replace(anchor, anchor + '        messageNotices.asReversed().filter { it.id != notice?.id }.forEach { add(Act.NoticeA(it)) }\n', 1)
          old = '                                IslandBus.notice.value = null'
          new = '''                                if (act.n.message != null) {
                                    IslandBus.messageNotices.value = IslandBus.messageNotices.value.filterNot { it.id == act.n.id }
                                    if (IslandBus.notice.value?.id == act.n.id) IslandBus.notice.value = null
                                } else IslandBus.notice.value = null'''
          if old not in s: raise SystemExit("Overlay swipe-dismiss branch not found")
          s = s.replace(old, new, 1)
          overlay.write_text(s)

          # Richer, less transparent glass: preserve the existing shape, gestures and layout.
          common = Path("app/src/main/java/com/akira/island/island/Common.kt")
          s = common.read_text()
          old = '''    val a = opacity.coerceIn(0.3f, 0.95f)
    val outline = shape.createOutline(size, layoutDirection, this)'''
          new = '''    // Stronger tinted body gives the material real visual weight instead of a see-through veil.
    val a = opacity.coerceIn(0.3f, 0.95f)
    val bodyAlpha = (0.76f + a * 0.20f).coerceIn(0.82f, 0.96f)
    val outline = shape.createOutline(size, layoutDirection, this)'''
          if old not in s: raise SystemExit("Glass alpha anchor not found")
          s = s.replace(old, new, 1)
          old = '''        drawRect(base.copy(alpha = a * 0.8f))
        drawRect(veil)
        drawRect(shade)'''
          new = '''        drawRect(base.copy(alpha = bodyAlpha))
        drawRect(Brush.verticalGradient(
            0f to Color.White.copy(alpha = 0.25f),
            0.22f to Color.White.copy(alpha = 0.09f),
            0.58f to base.copy(alpha = 0.10f),
            1f to Color.Black.copy(alpha = 0.38f),
        ))
        drawRect(shade)'''
          if old not in s: raise SystemExit("Glass body drawing anchor not found")
          s = s.replace(old, new, 1)
          old = '''        drawOutline(outline, rim, alpha = 0.35f, style = wideRim)
        drawOutline(outline, rim, style = thinRim)'''
          new = '''        drawOutline(outline, rim, alpha = 0.52f, style = wideRim)
        drawOutline(outline, rim, style = thinRim)
        // Crisp inner edge and a narrow top reflection make the surface read as glass.
        drawOutline(outline, Color.White.copy(alpha = 0.22f), style = Stroke(width = 0.8f * dp))'''
          if old not in s: raise SystemExit("Glass rim anchor not found")
          common.write_text(s.replace(old, new, 1))

          # Media transport: honour the session's supported actions and fall back to media-button events.
          controls = Path("app/src/main/java/com/akira/island/core/Controls.kt")
          s = controls.read_text()
          old = '''    fun playPause() {
        val c = mediaController ?: return
        if (c.playbackState?.state == PlaybackState.STATE_PLAYING) c.transportControls.pause()
        else c.transportControls.play()
    }'''
          new = '''    fun playPause() {
        val c = mediaController ?: return
        val state = c.playbackState
        val playing = state?.state == PlaybackState.STATE_PLAYING || state?.state == PlaybackState.STATE_BUFFERING
        val action = if (playing) PlaybackState.ACTION_PAUSE else PlaybackState.ACTION_PLAY
        val keyCode = if (playing) android.view.KeyEvent.KEYCODE_MEDIA_PAUSE else android.view.KeyEvent.KEYCODE_MEDIA_PLAY
        val supported = (state?.actions ?: 0L) and action != 0L
        runCatching {
            if (supported) {
                if (playing) c.transportControls.pause() else c.transportControls.play()
            } else {
                c.dispatchMediaButtonEvent(android.view.KeyEvent(android.view.KeyEvent.ACTION_DOWN, keyCode))
                c.dispatchMediaButtonEvent(android.view.KeyEvent(android.view.KeyEvent.ACTION_UP, keyCode))
            }
        }
    }'''
          if old not in s: raise SystemExit("playPause implementation not found")
          controls.write_text(s.replace(old, new, 1))

          # Version marker for this iteration.
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NEXUS debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-cyber-glass-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
