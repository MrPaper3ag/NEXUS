name: NEXUS Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v5

      - name: Checkout Android foundation
        uses: actions/checkout@v5
        with:
          repository: Akira9021/Dynamic-Island-
          ref: claude/android-dynamic-island-yrzsvq
          path: upstream

      - name: Apply NEXUS identity and overlay upgrades
        working-directory: upstream
        run: |
          python3 ../nexus-overlay/apply.py
          mkdir -p app/src/main/java/com/akira/island/ui/screens
          cp ../nexus-overlay/NexusBrandPanel.kt app/src/main/java/com/akira/island/ui/screens/NexusBrandPanel.kt
          cp ../nexus-overlay/Theme.kt app/src/main/java/com/akira/island/ui/Theme.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build NEXUS debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload NEXUS APK
        uses: actions/upload-artifact@v5
        with:
          name: NEXUS-cyber-glass-debug
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
